name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats and jq
        run: sudo apt-get update -q && sudo apt-get install -y -q bats jq
      - run: bats tests/

  bats-macos:
    name: bats tests (macOS, bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: brew install bats-core
      # Homebrew bash 5 sits ahead of /bin/bash on the runner; put /bin first
      # so the scripts (and bats) run under the system bash 3.2 the README
      # promises. Note bash 3.2 does not fail a test on a false `[[ ]]`, so
      # this job proves the scripts run there; the ubuntu job enforces the
      # `[[` assertions.
      - run: |
          export PATH="/bin:/usr/bin:$PATH"
          bash --version | head -1
          bats tests/

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.296   # bump on purpose
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version && claude plugin validate --strict .
